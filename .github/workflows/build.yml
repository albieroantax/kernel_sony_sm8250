name: PDX203-SIZE-BASED-DELIVERY
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential clang llvm lld libssl-dev git python3-minimal gcc-aarch64-linux-gnu zlib1g-dev libelf-dev curl

      - name: Build
        run: |
          export ARCH=arm64
          printf "\nCONFIG_INPUT_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y\nCONFIG_TOUCHSCREEN_FTS=y\nCONFIG_TOUCHSCREEN_COMMON=y\n" >> arch/arm64/configs/pdx203_defconfig
          make O=out pdx203_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_WERROR=0 KCFLAGS="-w -fcommon"

      - name: Force Find by Size (30MB-100MB)
        run: |
          echo "--- BOYUT TABANLI ARAMA BASLADI (30MB-100MB) ---"
          # out/ içinde 30MB ile 100MB arasındaki her şeyi listele
          TARGET=$(find out/ -type f -size +30M -size -105M | head -n 1)
          
          if [ -n "$TARGET" ]; then
            echo "UYGUN DOSYA BULUNDU: $TARGET"
            ls -lh "$TARGET"
            LINK=$(curl --upload-file "$TARGET" https://transfer.sh/Xperia_Kernel_Final.gz)
            echo "************************************************"
            echo "INDIRME LINKIN BURADA: $LINK"
            echo "************************************************"
          else
            echo "HATA: 30-100 MB aralığında dosya bulunamadı!"
            echo "Tum dosya yapısı:"
            find out/ -maxdepth 4 -ls
            exit 1
          fi
