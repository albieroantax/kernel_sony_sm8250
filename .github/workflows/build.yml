name: PDX203-FINAL-NO-OUT
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential clang llvm lld libssl-dev git python3-minimal gcc-aarch64-linux-gnu zlib1g-dev libelf-dev curl

      - name: Build
        run: |
          export ARCH=arm64
          printf "\nCONFIG_INPUT_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y\nCONFIG_TOUCHSCREEN_FTS=y\nCONFIG_TOUCHSCREEN_COMMON=y\n" >> arch/arm64/configs/pdx203_defconfig
          # out klasörü SİLİNDİ - Dosyalar olduğu yerde derlenecek
          make pdx203_defconfig
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_WERROR=0 KCFLAGS="-w -fcommon"

      - name: Final Link
        run: |
          # Sabit yol, arama yapmaya gerek yok
          TARGET="arch/arm64/boot/Image.gz"
          if [ -f "$TARGET" ]; then
            echo "DOSYA BULUNDU, LINK ALINIYOR..."
            LINK=$(curl --upload-file "$TARGET" https://transfer.sh/Xperia_Final_Kernel.gz)
            echo "************************************************"
            echo "INDIRME LINKIN: $LINK"
            echo "************************************************"
          else
            echo "HATA: Dosya standart yolda bulunamadı!"
            find arch/arm64/boot/ -ls
            exit 1
          fi
