name: PDX203-ULTIMATE-LINK-DELIVERY
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential clang llvm lld libssl-dev git python3-minimal gcc-aarch64-linux-gnu zlib1g-dev libelf-dev curl

      - name: Build
        run: |
          export ARCH=arm64
          printf "\nCONFIG_INPUT_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y\nCONFIG_TOUCHSCREEN_FTS=y\nCONFIG_TOUCHSCREEN_COMMON=y\n" >> arch/arm64/configs/pdx203_defconfig
          make pdx203_defconfig
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KBUILD_WERROR=0 KCFLAGS="-w -fcommon"

      - name: Upload to Transfer.sh (Link Delivery)
        # GitHub Artifacts yerine direkt internete yükle ve linki bas!
        run: |
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "--- DOSYA BULUNDU, LINK HAZIRLANIYOR ---"
            curl --upload-file arch/arm64/boot/Image.gz https://transfer.sh/Xperia_1_II_Kernel.gz > download_link.txt
            echo "********************************************"
            echo "INDIRME LINKIN BURADA:"
            cat download_link.txt
            echo "********************************************"
          else
            echo "Hata: Kernel olusmadi!"
            exit 1
          fi
