name: PDX203-ZERO-ERROR-FINAL
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          # zlib ve libelf: Image.gz paketleme hatalarını önlemek için kritik
          sudo apt-get install -y bc build-essential clang llvm lld libssl-dev git python3-minimal gcc-aarch64-linux-gnu zlib1g-dev libelf-dev

      - name: Kernel Configuration & Touch Fix
        run: |
          export ARCH=arm64
          # Dokunmatik sürücülerini defconfig'e en güvenli yöntemle (printf) ekle
          printf "\nCONFIG_INPUT_TOUCHSCREEN=y\nCONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y\nCONFIG_TOUCHSCREEN_FTS=y\nCONFIG_TOUCHSCREEN_COMMON=y\n" >> arch/arm64/configs/pdx203_defconfig
          make pdx203_defconfig

      - name: Build Kernel (No Out Folder)
        run: |
          # 'O=out' kullanmıyoruz; dosya karmaşasını kökten bitirdik
          make -j$(nproc --all) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_WERROR=0 \
            KCFLAGS="-w -fcommon"

      - name: Verify and Prepare Delivery
        # Dosya yerinde mi bak, değilse hata ver ki 24 dakikan boşa gitmesin
        run: |
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz ./Xperia_1_II_Kernel.gz
            echo "DOSYA_HAZIR=true" >> $GITHUB_ENV
          else
            echo "Kritik Hata: Image.gz olusmadi!"
            exit 1
          fi

      - name: Upload Kernel File
        if: env.DOSYA_HAZIR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PDX203-Kernel-Final-Package
          # Dosyayı direkt ana dizinden alıyoruz, artık 'bulamadım' diyemez
          path: Xperia_1_II_Kernel.gz
          if-no-files-found: error
