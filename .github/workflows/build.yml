name: PDX203-Touch-Official-Final
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev git python3-minimal

      - name: Configure Drivers
        run: |
          # Önceki hatalı sed komutlarını temizlemek için taze konfigürasyon basıyoruz
          # PDX203 (Xperia 1 II) için dokunmatik sürücülerini defconfig üzerinden zorluyoruz
          {
            echo "CONFIG_INPUT_TOUCHSCREEN=y"
            echo "CONFIG_TOUCHSCREEN_SYNAPTICS_DSX=y"
            echo "CONFIG_TOUCHSCREEN_FTS=y"
            echo "CONFIG_TOUCHSCREEN_COMMON=y"
          } >> arch/arm64/configs/pdx203_defconfig

      - name: Compilation
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Hataları görmezden gelmek yerine kodun derlenmesini sağlayan bayraklar (KCFLAGS)
          make O=out pdx203_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w -fcommon"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xperia1II-Kernel
          path: out/arch/arm64/boot/Image.gz
